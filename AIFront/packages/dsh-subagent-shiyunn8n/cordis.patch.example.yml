# Profile Bundle 片段：ShiyunN8n 子代理

将下面插入 DSH / Kylin Desktop 的 agent preset。
需能解析 `@aifront/dsh-subagent-shiyunn8n`，且 `shiyunn8n-agent` + `chomircode-agent` 可用。

```yaml
- insert:
    - id: subagent-shiyunn8n
      name: '@aifront/dsh-subagent-shiyunn8n'
      config:
        env:
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY
          DEEPSEEK_BASE_URL: !!js process.env.DEEPSEEK_BASE_URL || ''
          AIFRONT_PERMISSION_MODE: bypassPermissions
          AIFRONT_MAX_ROUNDS: '1024'
    - id: tool-subagent-shiyunn8n
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: shiyunn8n
        toolName: subagent_shiyunn8n
        enableRunInBackground: false
        maxDepth: provider-managed
```

父 Agent 将看到工具 `subagent_shiyunn8n`（provider 名 `shiyunn8n`）。
